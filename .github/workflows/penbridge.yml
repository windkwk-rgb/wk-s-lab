# PenBridge: PenBridge/ 폴더가 바뀌어 main에 올라가면 GitHub 서버가 APK와 EXE를 빌드한다.
# PenBridge/version.txt 버전의 Release(태그 penbridge-v버전)가 아직 없으면 새로 만든다
#   → 노트북의 PenBridge가 인터넷으로 확인해서 자동 업데이트.
#
# 필요한 저장소 Secret (Settings → Secrets and variables → Actions)
#   PENBRIDGE_KEYSTORE_B64 : 태블릿 앱 서명 키(debug.keystore)를 base64로 인코딩한 값
name: PenBridge build & release

on:
  push:
    branches: [main]
    paths:
      - 'PenBridge/**'
      - '.github/workflows/penbridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: penbridge-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Signing key
        env:
          KS: ${{ secrets.PENBRIDGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/penbridge.keystore"
            echo "PENBRIDGE_KEYSTORE=$RUNNER_TEMP/penbridge.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::PENBRIDGE_KEYSTORE_B64가 없어 임시 키로 서명해요. 기존 태블릿 앱을 업데이트할 수 없어요."
          fi
      - name: Build APK
        working-directory: PenBridge/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/PenBridge.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PenBridge.apk

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: PenBridge/windows/tablet
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build EXE (태블릿 앱 포함)
        run: dotnet publish PenBridge/windows -c Release -o out --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/PenBridge.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release (새 버전일 때만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d ' \r\n' < PenBridge/version.txt)
          TAG="penbridge-v$VER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG Release가 이미 있어요. PenBridge/version.txt를 올리면 새로 만들어요."
          else
            gh release create "$TAG" dist/PenBridge.exe dist/PenBridge.apk \
              --title "PenBridge v$VER" \
              --notes "자동 빌드. PenBridge.exe 하나에 태블릿 앱(APK)이 포함돼 있어요. 실행 후 '이 PC에 설치하기'를 누르세요."
          fi
