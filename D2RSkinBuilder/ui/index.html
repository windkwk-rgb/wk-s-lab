<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2R 스킨 빌더</title>
<link rel="icon" href="icon.png">
<style>
:root {
  --bg: #0e0d0b; --bar: #13110e; --panel: #1a1814; --panel2: #221f19; --line: #2b2721; --line2: #3a352c;
  --text: #ede6d6; --dim: #a49c8c; --dim2: #6e675b; --gold: #c8a35a; --gold2: #e2c27a; --gold3: #f3dca0;
  --sel: #2a2418; --red: #b8452f; --ok: #9fd8a4; --okbg: #1e2a1f; --blue: #8ec5ff; --bluebg: #1d2b3a;
  --warn: #f2b866; --warnbg: #3b2a12; --bad: #f0a99c; --badbg: #3a1a16;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--gold2); }
.hidden { display: none !important; }
.sub { color: var(--dim); font-size: 13.5px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.btn { height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: #5a5244; }
.btn.small { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1408; font-weight: 700; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff6ea; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--gold2); font-size: 13px; padding: 0; text-decoration: underline; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; background: var(--panel2); color: var(--dim); }
.st-same { background: var(--okbg); color: var(--ok); }
.st-new { background: var(--okbg); color: var(--ok); }
.st-patch { background: var(--bluebg); color: var(--blue); }
.st-replace { background: var(--warnbg); color: var(--warn); }
.st-cant { background: var(--badbg); color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2721; border: 1px solid var(--line2); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: 90vw; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: #3a1712; border: 1px solid var(--gold); display: grid; place-items: center; color: var(--gold2); font-weight: 900; font-family: Georgia, serif; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 24px; background: var(--bar); border-bottom: 1px solid var(--line); }
header.top .grow { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 200px; }

/* ---------- 홈 */
.status { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 24px; background: var(--bar); border-bottom: 1px solid var(--line); }
.stat { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dim2); }
.dot.on { background: #6fcf7a; } .dot.mid { background: var(--gold2); } .dot.off { background: #e5484d; }
.stat .t { flex: 1; min-width: 0; } .stat .k { font-size: 12px; color: var(--dim); }
.stat .v { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.homemain { display: flex; flex-wrap: wrap; gap: 24px; padding: 26px 24px 40px; max-width: 1280px; margin: 0 auto; }
.homemain > section { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.homemain > aside { flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; }
h1.big { margin: 0; font-size: 24px; font-weight: 900; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.recipe { padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; text-align: left; }
.recipe.cur { background: #1f1a12; border: 2px solid var(--gold); }
.recipe.prof { border-style: dashed; border-color: #4a443a; }
.recipe .n { font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.recipe .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #1a1408; font-weight: 700; }
.recipe .d { color: #cfc6b4; font-size: 13.5px; line-height: 1.6; flex: 1; }
.recipe .f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card { padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-size: 15px; }
.bigbtn { min-height: 72px; border-radius: 14px; border: 0; background: var(--red); color: #fff6ea; font-size: 19px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.bigbtn span { font-size: 13px; font-weight: 400; color: #f4d3c6; }
.bigbtn:disabled { background: #3a352c; color: var(--dim); cursor: default; } .bigbtn:disabled span { color: var(--dim); }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.chk i { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; }
.chk i.y { background: var(--okbg); color: var(--ok); } .chk i.n { background: var(--warnbg); color: var(--warn); }
.rowlink { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--panel2); border: 0; text-align: left; }
.rowlink span { color: var(--dim); font-size: 13px; }
.bar { height: 10px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.result { border-radius: 14px; padding: 16px 18px; }
.result.okr { background: #16281e; border: 1px solid #2c5a3d; } .result.err { background: #2c1a19; border: 1px solid #6b3430; }
.result h3 { margin: 0 0 6px; } .result p { margin: 6px 0; }
.code { display: inline-flex; align-items: center; gap: 8px; background: #0a0908; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 12px; font-family: Consolas, monospace; }
.steps { margin: 8px 0 0; padding-left: 20px; color: #cfc6b4; }
details.log pre { white-space: pre-wrap; font-size: 12px; color: #b9b2a2; max-height: 240px; overflow: auto; background: #0a0908; padding: 8px; border-radius: 8px; }
#diffCard table { border-collapse: collapse; font-size: 13px; } #diffCard td, #diffCard th { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: left; } #diffCard th { color: var(--dim); font-weight: 400; }

/* ---------- 고르기 */
.editor { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line2); }
.search input { flex: 1; background: transparent; border: 0; outline: none; color: var(--text); min-width: 80px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.seg button { height: 32px; padding: 0 12px; border-radius: 7px; border: 0; background: transparent; color: #cfc6b4; font-size: 13px; }
.seg button.on { background: var(--gold); color: #1a1408; font-weight: 700; }
.cmpbar { padding: 6px 24px; font-size: 13px; color: var(--dim); background: #12100d; border-bottom: 1px solid var(--line); }
.work { flex: 1; display: flex; min-height: 0; }
nav.goals { width: 236px; flex: none; overflow: auto; padding: 14px 10px; border-right: 1px solid var(--line); background: #12100d; display: flex; flex-direction: column; gap: 2px; }
nav.goals .hd { font-size: 12px; color: var(--dim); padding: 2px 10px 8px; }
nav.goals button { display: flex; justify-content: space-between; gap: 6px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 0; background: none; color: var(--text); }
nav.goals button b { font-weight: 400; color: var(--dim); }
nav.goals button.on { background: var(--sel); color: var(--gold3); font-weight: 700; } nav.goals button.on b { color: var(--gold3); }
nav.goals hr { border: 0; height: 1px; background: var(--line); margin: 8px 4px; }
.flist { width: 440px; flex: none; overflow: auto; padding: 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.work.list-only .flist { flex: 1; width: auto; border-right: 0; } .work.list-only .side { display: none; }
.work.big .flist { width: 340px; } .work.big nav.goals { display: none; }
.ghead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .ghead h2 { margin: 0; font-size: 19px; }
.frow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: left; width: 100%; }
.frow.cur { background: #221d14; border-color: var(--gold); }
.frow .nm { flex: 1; min-width: 0; } .frow .nm b { display: block; font-weight: 700; } .frow .nm small { display: block; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--line2); border: 0; padding: 0; position: relative; flex: none; }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8a8273; transition: left .15s; }
.sw.on { background: var(--gold); } .sw.on::after { left: 21px; background: #1a1408; }
.cdot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
details.adv { margin-top: 8px; } details.adv summary { cursor: pointer; color: var(--dim); font-size: 13.5px; padding: 6px 2px; }
details.adv .frow { margin-top: 8px; }
.empty { text-align: center; color: var(--dim); padding: 40px 10px; }
.side { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 16px; background: var(--bar); display: flex; flex-direction: column; gap: 12px; }
.side > * { flex: none; }
.pv { position: relative; flex: none; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #3a3426 0%, #1c1a15 60%, #110f0c 100%); border: 1px solid var(--line); user-select: none; touch-action: none; }
.pv .lay { position: absolute; border: 1px dashed; border-radius: 3px; }
.pv .lay.cur { border-style: solid; border-width: 2px; cursor: move; }
.pv .lay .h { position: absolute; right: -6px; bottom: -6px; width: 11px; height: 11px; border-radius: 2px; cursor: nwse-resize; }
.pv .tag { position: absolute; left: 0; top: -22px; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #1a1408; white-space: nowrap; }
.pv .txt { position: absolute; font-size: 11px; line-height: 1.45; white-space: nowrap; pointer-events: none; }
.pv .hud { position: absolute; left: 0; right: 0; bottom: 0; height: 15%; background: #15130f; border-top: 1px solid var(--line2); }
.pv .orb { position: absolute; bottom: 10%; width: 9%; aspect-ratio: 1; border-radius: 50%; }
.pvnote { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--dim); }
.dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .dhead h3 { margin: 0; font-size: 17px; flex: 1; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; font-size: 13.5px; }
.opts button small { font-size: 11px; color: var(--dim); }
.opts button.on { background: var(--gold); border-color: var(--gold); color: #1a1408; font-weight: 700; } .opts button.on small { color: #3a2e10; }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
.params label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--dim); }
.params .ctl { display: flex; gap: 8px; align-items: center; }
.params input[type=range] { flex: 1; accent-color: var(--gold); }
.params input[type=number], .params input[type=text], .params select { height: 34px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); padding: 0 8px; font-size: 14px; }
.params input[type=number] { width: 76px; text-align: center; }
.easy { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13.5px; background: var(--panel); border-radius: 10px; padding: 12px 14px; }
.easy .k { color: var(--dim); white-space: nowrap; } .easy .k.w { color: var(--warn); }
.detail { font-size: 13px; background: var(--panel); border-radius: 10px; padding: 10px 12px; line-height: 1.6; }
.shots { display: flex; flex-direction: column; gap: 8px; }
.srow { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sfile { font-size: 11.5px; color: var(--dim2); margin-bottom: 6px; word-break: break-all; }
.scells { display: flex; gap: 10px; flex-wrap: wrap; }
.scell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
.scell .lab { font-size: 12px; color: var(--dim); max-width: 150px; text-align: center; }
.scell img { height: 92px; max-width: 150px; object-fit: contain; border-radius: 6px; cursor: zoom-in; background: repeating-conic-gradient(#23201a 0% 25%, #1a1814 0% 50%) 50% / 14px 14px; }
.scell .ph { height: 92px; width: 96px; display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--warn); border: 1px dashed #4a443a; border-radius: 6px; padding: 4px; }
.scell .ph.same { color: var(--dim); }
.play { background: var(--panel2); border: 1px solid var(--line2); border-radius: 20px; padding: 5px 14px; font-size: 13px; }
.play.on { background: #2e5a34; border-color: #2e5a34; }
.prev { display: flex; gap: 6px; flex-wrap: wrap; } .prev img { width: 54px; height: 54px; object-fit: contain; background: #0a0908; border-radius: 6px; border: 1px solid var(--line); }
.ptable { border-collapse: collapse; font-size: 13px; background: #0a0908; border-radius: 8px; overflow: hidden; }
.ptable th, .ptable td { padding: 4px 10px; border-bottom: 1px solid #1f1c17; text-align: left; white-space: nowrap; }
.ptable th { color: var(--dim); font-weight: 400; } .ptable .on { background: #2a2418; } .ptable img { height: 30px; vertical-align: middle; }
.fontrow { display: flex; gap: 12px; flex-wrap: wrap; }
.fontbox { background: #0a0908; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 240px; }
.fontbox .smp { font-size: 22px; line-height: 1.4; color: #e9dcb5; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; z-index: 55; }
.modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 22px 24px; width: min(640px, 92vw); max-height: 86vh; overflow: auto; }
.modal h2 { margin: 0 0 6px; font-size: 19px; }
.modal ul { margin: 6px 0 14px; padding-left: 20px; font-size: 13.5px; color: var(--dim); max-height: 220px; overflow: auto; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; cursor: zoom-out; }
.lightbox img { width: min(520px, 90vw); max-height: 80vh; object-fit: contain; }
.lightbox div { color: #ddd; margin-top: 10px; text-align: center; }
.mlist { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
@media (max-width: 1100px) { .flist { width: 360px; } }
@media (max-width: 820px) {
  nav.goals { display: none; } .work { flex-direction: column; overflow: auto; }
  .flist, .work.big .flist { width: auto; border-right: 0; overflow: visible; } .side { overflow: visible; }
}
</style>
</head>
<body>

<!-- ================= 홈 ================= -->
<div id="home">
  <header class="top">
    <div class="grow"><div class="logo">D2</div><b style="font-size:18px">D2R 스킨 빌더</b><span class="sub" id="ver"></span></div>
    <button class="btn" onclick="applyPatch()" title="제가 보내 드린 최신 skinbuilder.mpq 나 패치 파일을 넣으면 프로그램이 새 버전이 돼요">업그레이드</button>
  </header>
  <div class="status">
    <div class="stat"><div class="dot" id="gDot"></div><div class="t"><div class="k">게임 폴더</div><div class="v" id="gameSub">찾는 중...</div></div><button class="linkbtn" onclick="pickGame()">바꾸기</button></div>
    <div class="stat"><div class="dot" id="bDot"></div><div class="t"><div class="k">기준 스킨 (기능을 얹을 스킨)</div><div class="v" id="baseSub"></div></div><button class="linkbtn" onclick="openBaseModal()">바꾸기</button></div>
    <div class="stat"><div class="dot" id="iDot"></div><div class="t"><div class="k">게임에 넣은 스킨</div><div class="v" id="instSub"></div></div><button class="linkbtn" id="copyCmdBtn" onclick="copyCmd('-mod ' + STATE.modName)">실행 옵션 복사</button></div>
  </div>
  <div class="homemain">
    <section>
      <div><h1 class="big">어떤 스킨으로 할까요?</h1><div class="sub" style="margin-top:4px">레시피를 고르면 필요한 기능이 한 번에 켜져요. 고른 뒤 하나씩 더하거나 뺄 수 있어요.</div></div>
      <div class="recipes" id="recipes"></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <button class="btn" style="height:48px;padding:0 20px" onclick="openEditor()">기능 하나씩 고르기</button>
        <button class="btn" onclick="profSave()">지금 설정을 내 설정으로 저장</button>
        <span class="sub" id="featSub"></span>
      </div>
    </section>
    <aside>
      <button class="bigbtn" id="buildBtn" onclick="startBuild()">스킨 만들어서 게임에 넣기<span id="buildSub"></span></button>
      <div class="hidden" id="prog"><div class="bar"><i id="barFill"></i></div><div class="sub" id="stepTxt" style="margin-top:6px"></div></div>
      <div class="result hidden" id="result"></div>
      <div class="card" id="checkCard"></div>
      <div class="card hidden" id="diffCard"></div>
      <div class="card">
        <h3>문제가 생겼을 때</h3>
        <button class="rowlink" onclick="startBisect()">게임이 튕겨요 <span>원인 찾기 →</span></button>
        <button class="rowlink" id="uninstBtn" onclick="uninstall()">원래 스킨으로 돌아가기 <span>만든 스킨 빼기 →</span></button>
        <button class="rowlink" onclick="api('/api/open',{})">만든 스킨 파일 보기 <span>폴더 열기 →</span></button>
      </div>
    </aside>
  </div>
</div>

<!-- ================= 기능 고르기 ================= -->
<div class="editor hidden" id="editor">
  <header class="top">
    <button class="btn" onclick="closeEditor()">← 홈</button>
    <label class="search"><span class="sub">찾기</span><input id="q" placeholder="큐브, 미니맵, 화살표, 룬, 물약, 소리…"></label>
    <div class="seg" id="viewSeg"></div>
    <div class="seg" id="filterSeg"></div>
    <button class="btn red" onclick="closeEditor();startBuild()" id="edBuild">만들기</button>
  </header>
  <div class="cmpbar" id="cmpbar"></div>
  <div class="work" id="work">
    <nav class="goals" id="goals"></nav>
    <div class="flist" id="flist"></div>
    <div class="side" id="side"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="modal hidden" id="bis"><div class="box" id="bisBox"></div></div>
<div class="modal hidden" id="baseModal"><div class="box" id="baseBox"></div></div>
<div class="lightbox hidden" id="lb" onclick="this.classList.add('hidden')"><div><img id="lbImg" alt=""><div id="lbCap"></div></div></div>

<script>
let P = null, S = {choices: {}, params: {}}, STATE = null, STATUS = {}, saveTimer = null;
let GOAL = 'top', FILTER = 'all', VIEW = 'both', SELF = null, PROFS = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const byId = {};
async function api(url, body) {
  const r = await fetch(url, body === undefined ? {cache: 'no-store'} : {method: 'POST', body: JSON.stringify(body)});
  return r.json();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800); }
function mb(n) { return (n / 1048576).toFixed(0) + 'MB'; }
try { VIEW = localStorage.getItem('sbView') || 'both'; } catch (e) {}

// ================= 목적별 분류 =================
// 기능 묶음의 group 과 id 로 "무엇을 하고 싶나요?" 탭을 정해요
const GOALS = [
  ['top', '자주 쓰는 기능'], ['map', '지도 · 길찾기'], ['mon', '몬스터 · 전투 정보'], ['inv', '인벤 · 큐브 · 창고'],
  ['hud', '화면 배치 (HUD)'], ['room', '방 만들기 · 사망 탈출'], ['item', '아이템 · 룬 · 물약'], ['fx', '스킬 아이콘 · 효과'],
  ['snd', '소리 · 글자'], ['etc', '기타'],
];
const GOAL_ID = {
  mini_map: 'map', beacon_next: 'map', exit_band: 'map', chaos_bridge_ox: 'map',
  monster_mods: 'mon', lightning_glow: 'mon',
  cube_farming: 'inv', bank_cube: 'inv', vendor_cube: 'inv', merc_cube: 'inv', esc_dictionary: 'inv',
  inv_routes: 'inv', inv_goods: 'inv', inv_herald: 'inv', quest_guide: 'inv',
  my_level_xp: 'hud', party_levels: 'hud', buff_icons: 'hud', exp_rainbow: 'hud',
  lobby_difficulty: 'room', esc_quick: 'room', quick_lobby: 'room', death_exit: 'room', title_text: 'room',
  defiler_skin: 'fx', potion_names: 'item',
};
function goalOf(f) {
  if (GOAL_ID[f.id]) return GOAL_ID[f.id];
  if (f.id.startsWith('arrows_')) return 'map';
  const g = f.group || '';
  if (g.startsWith('①')) return 'item';
  if (g.startsWith('②')) return 'inv';
  if (g.startsWith('③') || g.startsWith('⑤')) return 'map';
  if (g.startsWith('④')) return 'mon';
  if (g.startsWith('⑥')) return 'fx';
  if (g.startsWith('⑦')) return 'hud';
  if (g.startsWith('⑧') || g.startsWith('⑨')) return 'snd';
  return 'etc';
}
// "자주 쓰는 기능" = 직접 만든 기능(mine) 중 스킨 파일 묶음이 아닌 것
const isTop = f => f.mine && !/^(c_|scr_)/.test(f.id);
// 기본 화면에 보일 기능 / 고급(스킨 파일 묶음) 기능
const isCore = f => f.mine || !/^(c_|scr_)/.test(f.id);

// ================= 레시피 =================
// 기능 묶음에 든 추천 설정 + 목적별 레시피 (묶음에 있는 기능만 써요)
const RECIPES = [
  {name: '보스 · 카우 런', desc: '몬스터 특성 강조 · 미니맵 · 길찾기 화살표 · 출구 띠 · 죽으면 바로 대기실',
   ids: ['monster_mods', 'mini_map', 'arrows_catacomb_durance', 'arrows_halls', 'arrows_baal', 'arrows_court', 'chaos_bridge_ox', 'exit_band', 'death_exit', 'lobby_difficulty', 'esc_quick', 'my_level_xp', 'party_levels']},
  {name: '가볍게 (저사양)', desc: '글자·화면 기능만. 효과·조명·스킬 그림은 기준 스킨 그대로',
   ids: ['monster_mods', 'mini_map', 'exit_band', 'lobby_difficulty', 'esc_quick', 'death_exit']},
];
function recipeList() {
  const out = (P.presets || []).map(p => ({name: p.name, choices: p.choices, params: p.params || {}, kind: 'preset'}));
  for (const r of RECIPES) {
    const ch = {};
    for (const id of r.ids) if (byId[id]) ch[id] = byId[id].options[0].key;
    if (Object.keys(ch).length >= 3) out.push({name: r.name, desc: r.desc, choices: ch, params: {}, kind: 'recipe'});
  }
  return out;
}
const sameChoices = (a, b) => { const ka = Object.keys(a).filter(k => a[k]), kb = Object.keys(b).filter(k => b[k]); return ka.length === kb.length && ka.every(k => a[k] === b[k]); };
function recipeDesc(ch) { return Object.keys(ch).filter(id => byId[id] && isTop(byId[id])).slice(0, 5).map(id => shortName(byId[id])).join(' · '); }
function shortName(f) { return f.name.replace(/\s*\(.*?\)\s*/g, ' ').replace(/^\[실험\]\s*/, '').split(':')[0].trim(); }
async function useRecipe(i) {
  const r = recipeList()[i];
  if (!confirm(`"${r.name}"(으)로 바꿀까요? 지금 고른 기능은 이 레시피로 바뀌어요.\n(지금 설정을 남기려면 먼저 "내 설정으로 저장"을 눌러 주세요)`)) return;
  S.choices = Object.assign({}, r.choices); Object.assign(S.params, r.params); queueSave(); renderHome(); toast(`"${r.name}"(으)로 바꿨어요`);
}

// ================= 설정 =================
function chosen(f) { return S.choices[f.id] || ''; }
function setChoice(f, key) {
  if (key) S.choices[f.id] = key; else delete S.choices[f.id];
  if (key) for (const r of (f.requires || [])) if (byId[r] && !S.choices[r]) { S.choices[r] = byId[r].options[0].key; toast(`"${byId[r].name}"도 같이 켰어요 (꼭 필요해요)`); }
  if (!key) for (const g of P.features) if ((g.requires || []).includes(f.id) && S.choices[g.id]) { delete S.choices[g.id]; toast(`"${g.name}"도 같이 뺐어요 (이 기능이 있어야 해요)`); }
  queueSave();
}
const DEF = {};
function param(id, dflt) { return id in S.params ? S.params[id] : id in DEF ? DEF[id] : dflt; }
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); updateCounts(); }
async function saveNow() { clearTimeout(saveTimer); saveTimer = null; await api('/api/settings', S); }
function selCount() { return Object.keys(S.choices).filter(k => byId[k] && S.choices[k]).length; }

// ================= 홈 =================
function renderHome() {
  const st = STATE;
  $('ver').textContent = 'v' + st.version;
  $('gDot').className = 'dot ' + (st.gameFound ? 'on' : 'off');
  $('gameSub').textContent = st.gameFound ? st.gameDir : '못 찾았어요 — [바꾸기]로 알려 주세요';
  $('bDot').className = 'dot ' + (st.base ? 'on' : st.basePath && !st.baseErr ? 'mid' : 'off');
  $('baseSub').textContent = st.base ? `${st.base.mod} · 파일 ${st.base.files.toLocaleString()}개 · ${mb(st.base.size)}`
    : st.baseErr ? st.baseErr : st.basePath ? '여는 중...' : '골라 주세요 — [바꾸기]';
  $('iDot').className = 'dot ' + (st.installed ? 'mid' : '');
  $('instSub').textContent = st.installed ? `${st.modName} · ${st.inGame ? '게임 폴더 mods' : '이 프로그램 폴더'}` : '아직 없어요';
  $('copyCmdBtn').classList.toggle('hidden', !st.installed);
  $('uninstBtn').classList.toggle('hidden', !st.installed);
  $('buildBtn').disabled = !st.base || st.job.running;
  // 레시피 + 내 설정
  const rs = recipeList();
  let h = rs.map((r, i) => {
    const cur = sameChoices(r.choices, S.choices);
    const n = Object.keys(r.choices).filter(k => byId[k]).length;
    return `<div class="recipe ${cur ? 'cur' : ''}"><div class="n">${esc(r.name)}${cur ? '<span class="tag">지금 쓰는 중</span>' : ''}</div>
      <div class="d">${esc(r.desc || recipeDesc(r.choices))}</div>
      <div class="f"><span class="sub">기능 ${n}개</span>${cur ? `<button class="linkbtn" onclick="openEditor('sel')">고른 것 보기</button>` : `<button class="btn small" onclick="useRecipe(${i})">이걸로 바꾸기</button>`}</div></div>`;
  }).join('');
  h += PROFS.map(p => `<div class="recipe prof"><div class="n">${esc(p.name)}</div><div class="d">내 설정 · ${esc(p.saved)} 저장</div>
      <div class="f"><button class="linkbtn" onclick="profCmd('delete', ${esc(JSON.stringify(p.name))})">지우기</button><button class="btn small" onclick="profCmd('load', ${esc(JSON.stringify(p.name))})">불러오기</button></div></div>`).join('');
  $('recipes').innerHTML = h;
  updateCounts();
  renderHomeCheck();
}
function stateCounts() {
  const c = {patch: 0, new: 0, replace: 0, same: 0, cant: 0};
  for (const f of P.features) { const k = S.choices[f.id]; const s = k && STATUS[f.id] && STATUS[f.id][k]; if (s) c[s.state]++; }
  return c;
}
function updateCounts() {
  const n = selCount();
  if ($('featSub')) {
    const c = stateCounts();
    $('featSub').textContent = n ? `켜진 기능 ${n}개` + (Object.keys(STATUS).length ? ` · 덧붙임 ${c.patch} · 새로 더함 ${c.new} · 기준 스킨 파일 바꿈 ${c.replace}` : '') : '아직 고른 기능이 없어요 (안 골라도 기준 스킨 그대로 만들 수 있어요)';
    $('buildSub').textContent = `기능 ${n}개`;
    $('edBuild').textContent = `만들기 (${n})`;
  }
}
async function refresh() { STATE = await api('/api/state'); renderHome(); return STATE; }
async function pickGame() {

async function pickBase(path) {

    : c.running ? `기준 스킨(${esc(STATE.base.mod)})과 비교하는 중... ${c.total ? Math.round(c.done * 100 / c.total) : 0}%`
    : `기준 스킨 <b>${esc(STATE.base.mod)}</b>과 비교했어요 — <span class="badge st-same">✓ 이미 있음</span> <span class="badge st-new">새로 더함</span> <span class="badge st-patch">덧붙임</span> <span class="badge st-replace">⚠ 기준 스킨 파일 바꿈</span> <span class="badge st-cant">넣을 수 없음</span>`;
  if (!$('editor').classList.contains('hidden')) renderEditor(true);

async function startBuild() {
  if (saveTimer) await saveNow();
  $('result').classList.add('hidden'); $('buildBtn').disabled = true;
  $('prog').classList.remove('hidden'); $('barFill').style.width = '0%'; $('stepTxt').textContent = '준비 중...';
  const r = await api('/api/build', {});
  if (!r.ok) { $('buildBtn').disabled = false; $('prog').classList.add('hidden'); showResult(false, r.error); return; }
  const tick = async () => {
    const st = await refresh(); const j = st.job;
    $('barFill').style.width = j.percent + '%'; $('stepTxt').textContent = `${j.step || ''} ${j.percent ? j.percent + '%' : ''}`;
    if (!j.done) return setTimeout(tick, 300);
    $('prog').classList.add('hidden');
    if (j.error) showResult(false, j.error, j.log); else showResult(true, j);
    renderHome();
  };
  tick();
}
function showResult(ok, j, lg) {
  const box = $('result');
  box.className = 'result ' + (ok ? 'okr' : 'err');
  const logHtml = l => (l && l.length) ? `<details class="log"><summary class="sub">자세한 기록</summary><pre>${esc(l.join('\n'))}</pre></details>` : '';
  if (!ok) { box.innerHTML = `<h3>만들지 못했어요</h3><p>${esc(j)}</p>${logHtml(lg)}`; return; }
  const cmd = '-mod ' + STATE.modName;
  box.innerHTML = `<h3>✅ 완성! ${j.inGame ? '게임에 넣었어요' : '만들었어요'}</h3>
    ${j.inGame ? '' : `<p>게임 폴더를 몰라서 이 프로그램 폴더에 만들었어요. [만든 스킨 파일 보기]에서 <b>mods</b> 폴더를 게임 폴더 안에 복사하세요.</p>`}
    <p><b>처음 한 번만</b> 게임 실행 옵션을 바꿔 주세요 (예전에 했다면 그대로 두면 돼요):</p>
    <ol class="steps"><li>Battle.net → 디아블로 II: 레저렉션 → 재생 버튼 옆 ⚙ → <b>게임 설정</b></li><li><b>추가 명령줄 인수</b>에 아래 글자 (원래 스킨 이름 대신)</li></ol>
    <p style="margin-top:10px"><span class="code">${cmd} <button class="btn small" onclick="copyCmd('${cmd}')">복사</button></span></p>
    ${logHtml(j.log)}`;
}
function copyCmd(t) { navigator.clipboard.writeText(t).then(() => toast('"' + t + '" 를 복사했어요'), () => toast(t)); }
async function uninstall() {

}

// ---- 튕김 원인 찾기
let BIS = null, BISN = {}, bisTimer = null;
async function startBisect() {
  if (!confirm('고른 기능을 반씩 나눠 넣은 시험 스킨을 차례로 만들어 게임에 넣어요.\n매번 게임을 켜 보고 "켜졌어요 / 튕겼어요"만 눌러 주세요 (보통 5~8번).\n시작할까요?')) return;
  if (saveTimer) await saveNow();
  const r = await api('/api/bisect', {cmd: 'start'});
  if (!r.ok) { alert(r.error || '시작하지 못했어요'); return; }
  $('bis').classList.remove('hidden'); bisPoll();
}
async function bisCmd(cmd) { const r = await api('/api/bisect', {cmd}); if (r && r.bisect) { BIS = r.bisect; BISN = r.names; renderBis(); } bisPoll(); }
async function bisPoll() {
  clearTimeout(bisTimer);
  const r = await api('/api/bisect', {cmd: 'state'});
  if (!r || !r.bisect) return;
  BIS = r.bisect; BISN = r.names; renderBis();
  if (BIS.active && BIS.phase === 'building') bisTimer = setTimeout(bisPoll, 700);
}
function renderBis() {
  const b = BIS; if (!b || !b.active) { $('bis').classList.add('hidden'); return; }
  const nm = id => esc(BISN[id] || id);
  let h = `<h2>튕김 원인 찾기 · ${b.round}번째 시험</h2><div class="sub">남은 후보 ${b.cand.length}개 / 처음 ${b.total}개</div>`;
  if (b.phase === 'building') h += `<div style="margin-top:12px"><div class="bar"><i style="width:${b.percent}%"></i></div><div class="sub" style="margin-top:6px">시험 스킨을 만들어 게임에 넣는 중... ${b.percent}%</div></div>`;
  if (b.phase === 'waiting') h += `<p><b>게임을 켜 보세요.</b> 캐릭터 고르는 화면까지 들어가면 "켜졌어요"를 눌러 주세요. 게임을 끈 뒤에 눌러야 다음 시험 스킨을 넣을 수 있어요. 이 창은 끝날 때까지 켜 두세요.</p>
    <div class="sub">이번 시험에 들어간 기능 ${b.testing.length}개</div><ul>${b.testing.map(id => `<li>${nm(id)}</li>`).join('')}</ul>
    <div class="acts"><button class="btn" style="background:#2e5a34;border-color:#2e5a34;color:#fff" onclick="bisCmd('ok')">✓ 켜졌어요</button><button class="btn" style="background:#7a2418;border-color:#7a2418;color:#fff" onclick="bisCmd('crash')">✗ 튕겼어요</button></div>`;
  if (b.phase === 'error') h += `<p class="bad">${esc(b.error)}</p><div class="acts"><button class="btn" onclick="bisCmd('stop')">닫기</button></div>`;
  if (b.phase === 'done') {
    h += b.error ? `<p>${esc(b.error)}</p>` : '';
    h += `<p>원인으로 보이는 기능: <b>${nm(b.result)}</b></p>`;
    if (b.partners.length) h += `<div class="sub">이 기능은 아래 기능들 중 무언가와 같이 넣을 때만 튕겨요</div><ul>${b.partners.map(id => `<li>${nm(id)}</li>`).join('')}</ul>`;
    h += `<div class="acts"><button class="btn gold" onclick="bisDrop()">이 기능 빼고 다시 만들기</button><button class="btn" onclick="bisCmd('stop')">닫기 (그대로 두기)</button></div>
      <div class="sub" style="margin-top:10px">지금 게임에는 마지막 시험 스킨이 들어 있어요. 닫았다면 홈에서 다시 "스킨 만들어서 게임에 넣기"를 눌러 주세요.</div>`;
  }
  if (b.phase !== 'done' && b.phase !== 'error') h += `<div class="acts" style="justify-content:flex-end"><button class="linkbtn" onclick="if(confirm('원인 찾기를 그만할까요?'))bisCmd('stop')">그만하기</button></div>`;
  $('bisBox').innerHTML = h; $('bis').classList.remove('hidden');
}
async function bisDrop() {
  const id = BIS.result; delete S.choices[id]; await saveNow();
  await api('/api/bisect', {cmd: 'stop'}); $('bis').classList.add('hidden');
  toast('"' + (BISN[id] || id) + '" 를 뺐어요. 다시 만들어요'); updateCounts(); startBuild();
}

async function profList(r) {
  r = r || await api('/api/profile', {cmd: 'list'});
  PROFS = (r.profiles || []).sort((a, b) => a.name.localeCompare(b.name));
  if (STATE) renderHome();

async function profSave() {
  if (saveTimer) await saveNow();
  const n = prompt('이 설정의 이름 (같은 이름이면 덮어써요)', '내 설정 ' + (PROFS.length + 1));
  if (!n) return;
  const r = await api('/api/profile', {cmd: 'save', name: n});
  if (!r.ok) { alert(r.error); return; }

}
async function profCmd(cmd, n) {
  if (cmd === 'delete' && !confirm('"' + n + '" 설정을 지울까요?')) return;
  if (cmd === 'load' && !confirm('"' + n + '" 설정을 불러올까요? 지금 고른 것은 바뀌어요')) return;
  if (saveTimer) await saveNow();
  const r = await api('/api/profile', {cmd, name: n});
  if (!r.ok) { alert(r.error); return; }
  if (cmd === 'load') { S = {choices: r.choices || {}, params: r.params || {}}; toast('"' + n + '" 불러왔어요'); }
  await profList(r);
}

let DIFF = null;
async function loadDiff() { DIFF = await api('/api/basediff', {}); renderHomeCheck(); }

    tag() { return `파티원 레벨 ${num('pl_x', 0)}, ${num('pl_y', 0)}`; },
    draw(b) { const fs = (FONTPX[param('pl_size', '작게')] || 44) * .8 * S_;
      return {inner: `<div style="position:absolute;inset:0;font-size:${fs}px;line-height:${150 * S_}px;color:#e2c27a">82 레벨 원소술사<br>91 레벨 성기사</div>`}; }},
  buff_icons: {color: '#f2b866', label: '버프 아이콘',
    box() { const sz = 70 * num('bi_size', 100) / 100, gap = 80 * num('bi_gap', 100) / 100; const w = sz + gap * 3;
      return {x: W0 / 2 - w / 2 + num('bi_dx', 0) * 20, y: H0 * .6 + num('bi_dy', 0) * 20, w, h: sz}; },
    move(dx, dy) { setNum('bi_dx', num('bi_dx', 0) + dx / 20, -10, 10, .5); setNum('bi_dy', num('bi_dy', 0) + dy / 20, -10, 10, .5); },
    resize(dx, dy) { setNum('bi_size', num('bi_size', 100) + dy / 70 * 100, 50, 250, 5); },
    tag() { return `버프 아이콘 ${num('bi_dx', 0)}, ${num('bi_dy', 0)} · ${num('bi_size', 100)}%`; },
    draw(b) { const sz = 70 * num('bi_size', 100) / 100 * S_, gap = 80 * num('bi_gap', 100) / 100 * S_;
      return {inner: ['#6d5a2c', '#2c4f6d', '#6d2c2c', '#3a5a2c'].map((c, i) => `<div style="position:absolute;left:${i * gap}px;top:0;width:${sz}px;height:${sz}px;border-radius:3px;background:${c}"></div>`).join('')}; }},
  monster_mods: {color: '#e58c7a', label: '몬스터 특성 줄',
    box() { return {x: W0 / 2 - 460, y: 60, w: 920, h: 230 + monShift()}; },
    tag() { return '몬스터 특성 줄 (자리는 고정 · 글자 크기·색만)'; },
    draw(b) { const mk = MMARK[param('mm_marker', '★')] || MMARK['★'];
      const line = (k, ko) => { const c = MMCOL[param('mm_color::' + k, '')]; return c ? `<span style="color:${c}">${mk[0]}${ko}${mk[1]}</span>` : ''; };
      const mods = [line('monsteruniqueprop2', '번개 강화'), line('uniquecursed', '저주받음'), line('monsteruniqueprop6', '돌가죽'), line('monsteruniqueprop7', '다발 사격')].filter(Boolean).join(' ') || '<span style="color:#fff">번개 강화 저주받음</span>';
      const big = {'그대로': 1, '크게': 1.25, '아주 크게': 1.45, '최대': 1.7}[param('mm_font_size', '크게')] || 1;
      const res = '<span style="color:#ff5050">화염 0</span> · <span style="color:#7070ff">냉기 75</span> · <span style="color:#ffff64">번개 33</span>';
      const nl = param('mm_res_nl', '다른 줄로') !== '같은 줄로';
      return {inner: `<div style="position:absolute;inset:0;text-align:center;font-size:${30 * S_}px;line-height:1.5;color:#fff"><div style="height:${18 * S_}px;margin:${8 * S_}px 10%;background:#7a2418;border-radius:2px"></div>뒤틀린 대장 · 챔피언<br>${nl ? res + '<br>' : res + ' '}<span style="font-size:${30 * big * S_}px">${mods}</span><div style="margin-top:${(monShift() - 90 + 20) * S_}px;color:#a49c8c">면역: 냉기</div></div>`}; }},
  exp_rainbow: {color: '#c7a6f2', label: '경험치 바',
    box() { return {x: W0 / 2 - 760, y: H0 - 251, w: 1520, h: 18}; },
    tag() { return '경험치 바 (기준 스킨 자리)'; },
    draw() { return {inner: '<div style="position:absolute;inset:0;background:linear-gradient(90deg,#e5484d,#f2b866,#f2d45c,#6fcf7a,#4c9aff,#9d7bff)"></div>'}; }},
  quick_lobby: {color: '#f0a99c', label: '대기실 버튼',
    box() { const sc = num('ql_size', 60) / 100; return {x: W0 / 2 - 1454 + num('ql_x', 300), y: H0 - 412 + num('ql_y', -130), w: 200 * sc, h: 90 * sc}; },
    move(dx, dy) { setNum('ql_x', num('ql_x', 300) + dx, -1000, 3000, 10); setNum('ql_y', num('ql_y', -130) + dy, -800, 400, 10); },
    tag() { return `대기실 버튼 ${num('ql_x', 300)}, ${num('ql_y', -130)}`; },
    draw(b) { return {inner: `<div style="position:absolute;inset:0;display:grid;place-items:center;background:#5a1f17;color:#fff;font-size:${28 * S_}px;border-radius:3px">대기실</div>`}; }},
};
function monShift() { const fs = {'크게': 40, '아주 크게': 55, '최대': 75}[param('mm_font_size', '크게')] || 0; return fs + (param('mm_res_nl', '다른 줄로') !== '같은 줄로' ? 50 : 0) + num('mm_gap', 0); }
const PVPARAMS = new Set(['mp_size', 'mp_x', 'mp_y', 'mp_alpha', 'mp_zoom', 'mi_dx', 'mi_dy', 'lx_dx', 'lx_dy', 'lx_gap', 'lx_line', 'lx_size', 'pl_x', 'pl_y', 'pl_size',
  'bi_dx', 'bi_dy', 'bi_gap', 'bi_size', 'mm_marker', 'mm_font_size', 'mm_res_nl', 'mm_gap', 'ql_x', 'ql_y', 'ql_size']);
function setNum(id, v, lo, hi, step) {
  const f = Object.values(byId).find(f => (f.params || []).some(p => p.id === id)); const p = f && f.params.find(p => p.id === id);
  if (p && p.min !== undefined) { lo = +p.min; hi = +p.max; step = +p.step || step; }
  v = Math.round(v / step) * step; v = Math.max(lo, Math.min(hi, v)); v = +v.toFixed(3);
  S.params[id] = String(v); syncParamInputs(id);
}
let S_ = 1;
function txt(x, y, w, html, align, color, fs) { return `<div class="txt" style="left:${x * S_}px;top:${y * S_}px;width:${w * S_}px;text-align:${align};color:${color};font-size:${fs * S_}px">${html}</div>`; }
function drawPreview() {
  const pv = $('pv'); if (!pv) return;
  S_ = pv.clientWidth / W0;
  let h = `<div class="hud"><div class="orb" style="left:3%;background:#8a1e1e"></div><div class="orb" style="right:3%;background:#1e2e8a"></div></div>
    <div style="position:absolute;left:47%;top:44%;width:6%;height:14%;border-radius:40% 40% 10% 10%;background:#4a4234"></div>
    <div style="position:absolute;left:${46 * S_}px;top:${266 * S_}px;display:flex;flex-direction:column;gap:${70 * S_}px">${[0, 1].map(() => `<div style="width:${130 * S_}px;height:${80 * S_}px;border-radius:3px;background:#3a352c"></div>`).join('')}</div>`;
  for (const [id, L] of Object.entries(LAYERS)) {
    if (!byId[id]) continue;
    const on = !!S.choices[id], cur = SELF === id;
    if (!on && !cur) continue;
    const b = L.box(), d = L.draw ? L.draw(b) : {};
    h += `<div class="lay ${cur ? 'cur' : ''}" data-id="${id}" tabindex="${cur ? 0 : -1}" style="left:${b.x * S_}px;top:${b.y * S_}px;width:${b.w * S_}px;height:${b.h * S_}px;border-color:${L.color};opacity:${on ? 1 : .45}">
      ${d.inner || ''}${cur ? `<div class="tag" style="background:${L.color}">${esc(L.tag())}${on ? '' : ' · 꺼짐'}</div>${L.resize ? `<div class="h" data-h="1" style="background:${L.color}"></div>` : ''}` : ''}</div>`;
    if (d.extra) h += d.extra;
  }
  pv.innerHTML = h;
}
// 끌어서 옮기기 · 크기 바꾸기 · 방향키
let DRAG = null;
document.addEventListener('pointerdown', e => {
  const lay = e.target.closest && e.target.closest('.pv .lay'); if (!lay) return;
  const id = lay.dataset.id;
  if (SELF !== id) { SELF = id; renderEditor(true); return; }
  if (!LAYERS[id].move && !e.target.dataset.h) return;
  DRAG = {id, x: e.clientX, y: e.clientY, resize: !!e.target.dataset.h}; e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  const dx = (e.clientX - DRAG.x) / S_, dy = (e.clientY - DRAG.y) / S_;
  const L = LAYERS[DRAG.id]; const before = JSON.stringify(S.params);
  if (DRAG.resize) { if (L.resize) L.resize(dx, dy); } else if (L.move) L.move(dx, dy);
  if (JSON.stringify(S.params) !== before) { DRAG.x = e.clientX; DRAG.y = e.clientY; drawPreview(); }
});
document.addEventListener('pointerup', () => { if (DRAG) { DRAG = null; queueSave(); updateRowSummary(); } });
document.addEventListener('keydown', e => {
  if ($('editor').classList.contains('hidden') || !$('pv') || !SELF || !LAYERS[SELF] || !LAYERS[SELF].move) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const k = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key]; if (!k) return;
  e.preventDefault(); const m = e.shiftKey ? 100 : 10;
  LAYERS[SELF].move(k[0] * m, k[1] * m); drawPreview(); queueSave(); updateRowSummary();
});
addEventListener('resize', () => drawPreview());

// ---------- 그림 · 소리 · 글꼴 · 물약 표
function mediaHtml(f, cur) {
  const lab = l => (f.labels && f.labels[l]) || l;
  const shots = (f.shots || []).map(r => `<div class="srow"><div class="sfile">${esc(r.file)}</div><div class="scells">${
    Object.entries(r.v).map(([l, v]) => `<div class="scell">${
      v === 'empty' ? '<div class="ph">비어 있음<br>(이 버전은<br>안 보이게 함)</div>'
      : v.startsWith('same:') ? `<div class="ph same">${esc(lab(v.slice(5)))}와<br>같은 그림</div>`
      : `<img src="${v}" loading="lazy" alt="${esc(lab(l))}" onclick="zoom('${v}','${esc(r.file)} · ${esc(lab(l))}')">`
    }<span class="lab">${esc(lab(l))}</span></div>`).join('')}</div></div>`).join('');
  const sounds = (f.sounds || []).map(r => `<div class="srow"><div class="sfile">🔊 ${esc(r.file)}</div><div class="scells">${
    Object.entries(r.v).map(([l, v]) => typeof v === 'number'
      ? `<button class="play" onclick="playSnd(this,${v})">▶ ${esc(lab(l))}</button>`
      : `<span class="sub" style="font-size:12.5px;padding:5px 4px">${esc(lab(l))}: ${v === 'empty' ? '소리 없음(꺼짐)' : esc(lab(v.slice(5))) + '와 같은 소리'}</span>`).join('')}</div></div>`).join('');
  const prev = (f.previews || []).length ? `<div class="prev">${f.previews.slice(0, 12).map(p => `<img src="${p.img}" title="${esc(p.name)}" alt="" loading="lazy">`).join('')}</div>` : '';
  const potion = f.kind === 'potion' ? potionTable(f, cur) : '';
  const body = potion + (shots || sounds ? `<div class="shots">${shots}${sounds}</div>` : prev) + fontsHtml(f);
  return body;
}
function zoom(src, cap) { $('lbImg').src = src; $('lbCap').textContent = cap; $('lb').classList.remove('hidden'); }
const audio = new Audio(); let playingBtn = null;
function playSnd(btn, i) {
  if (playingBtn === btn && !audio.paused) { audio.pause(); btn.classList.remove('on'); playingBtn = null; return; }
  if (playingBtn) playingBtn.classList.remove('on');
  audio.src = '/api/sound?i=' + i; audio.play().catch(() => toast('이 소리는 재생할 수 없어요'));
  btn.classList.add('on'); playingBtn = btn;
}
audio.addEventListener('ended', () => { if (playingBtn) playingBtn.classList.remove('on'); playingBtn = null; });
function d2text(sv) {
  let out = '', color = '#ffffff';
  for (const p of String(sv || '').split(/(ÿc.)/)) {
    if (/^ÿc.$/.test(p)) { color = D2C[p[2]] || '#ffffff'; continue; }
    if (p) out += `<span style="color:${color}">${esc(p)}</span>`;
  }
  return out || '<span class="sub">(없음)</span>';
}
function potionTable(f, cur) {
  const vers = Object.keys(f.potion_names);
  const lab = l => (f.options.find(o => o.key === l) || {label: l}).label;
  const head = `<tr><th>물약</th><th>그림</th>${vers.map(l => `<th class="${cur === l ? 'on' : ''}">${esc(lab(l))}</th>`).join('')}</tr>`;
  const rows = f.potions.map(p => `<tr><td>${esc(p.kr)}</td><td>${p.img ? `<img src="img/pot_${p.key}.webp" alt="" onerror="this.remove()">` : '-'}</td>${vers.map(l => `<td class="${cur === l ? 'on' : ''}">${d2text(f.potion_names[l][p.key])}</td>`).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto"><table class="ptable">${head}${rows}</table></div>`;
}
const loadedFonts = new Set();
function fontsHtml(f) {
  if (!f.fonts) return '';
  const lab = l => (f.labels && f.labels[l]) || l;
  return f.fonts.map(r => `<div class="sfile">🔤 ${esc(r.file)}</div><div class="fontrow">${Object.entries(r.v).map(([l, b]) => {
    if (!loadedFonts.has(b)) { loadedFonts.add(b); const ff = new FontFace('fb' + b, `url(/api/sound?i=${b})`); ff.load().then(x => document.fonts.add(x)).catch(() => {}); }
    return `<div class="fontbox"><div class="sub">${esc(lab(l))}</div><div class="smp" style="font-family:'fb${b}', sans-serif">디아블로 2 레저렉션<br>Diablo II · 조던의 반지 0123</div></div>`;
  }).join('')}</div>`).join('');
}

(async () => {
  P = await (await fetch('/api/pack')).json();
  P.features.forEach(f => { byId[f.id] = f; for (const p of f.params || []) DEF[p.id] = p.default; });
  const st = await refresh();
  S = {choices: st.settings.choices || {}, params: st.settings.params || {}};
  renderHome();
  bisPoll();
  profList();
  $('q').addEventListener('input', () => { clearTimeout(renderEditor.t); renderEditor.t = setTimeout(() => renderEditor(), 150); });
  if (st.basePath && !st.base) { const w = async () => { const s = await refresh(); if (!s.base && !s.baseErr) setTimeout(w, 500); else pollStatus(); }; w(); }
  else pollStatus();
  setInterval(() => fetch('/api/ping').catch(() => {}), 5000);
  fetch('/api/ping');
  addEventListener('pagehide', () => navigator.sendBeacon('/api/bye'));
})();
