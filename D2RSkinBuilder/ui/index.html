<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2R 스킨 빌더</title>
<link rel="icon" href="icon.png">
<style>
:root {
  --bg: #111317; --panel: #1a1d23; --panel2: #22262e; --line: #2e333d; --text: #e9ecf1; --dim: #99a1ae;
  --gold: #d9b45a; --green: #3fae6a; --green2: #2f8f55; --red: #e0675b; --blue: #5b9ae0; --warn: #f0a35b;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.home { max-width: 780px; margin: 0 auto; padding: 32px 20px 60px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.brand h1 { margin: 0; font-size: 24px; color: var(--gold); letter-spacing: .5px; }
.brand span { color: var(--dim); font-size: 13px; }
.lead { color: var(--dim); font-size: 14px; margin: 0 0 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
.card .row { display: flex; align-items: center; gap: 14px; }
.card .num { width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); color: var(--gold); display: grid; place-items: center; font-weight: 700; flex: none; }
.card .body { flex: 1; min-width: 0; }
.card .title { font-weight: 700; font-size: 16px; }
.sub { color: var(--dim); font-size: 13.5px; word-break: break-all; }
.sub.ok { color: #8fd6a8; } .sub.bad { color: var(--warn); }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; white-space: nowrap; }
.btn:hover { border-color: #4a515e; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 44px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; font-size: 13px; }
.chip.on { border-color: var(--blue); color: #cfe2ff; }
button.chip:hover { border-color: #4a515e; }
.big { width: 100%; margin-top: 8px; padding: 18px; border: 0; border-radius: 14px; background: var(--green); font-size: 19px; font-weight: 700; color: #fff; }
.big:hover { background: #46bb74; }
.big:disabled { background: #3a3f48; color: var(--dim); cursor: default; }
.progress { margin-top: 14px; }
.bar { height: 10px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
.progress .step { color: var(--dim); font-size: 13.5px; margin-top: 6px; }
.result { margin-top: 14px; border-radius: 14px; padding: 18px 20px; }
.result.ok { background: #16281e; border: 1px solid #2c5a3d; }
.result.err { background: #2c1a19; border: 1px solid #6b3430; }
.result h3 { margin: 0 0 8px; font-size: 17px; }
.result p { margin: 6px 0; }
.code { display: inline-flex; align-items: center; gap: 8px; background: #0c0e11; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 12px; font-family: Consolas, monospace; font-size: 15px; color: #fff; }
.steps { margin: 8px 0 0; padding-left: 20px; color: #cfd6e0; }
.foot { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--dim); font-size: 13px; text-decoration: underline; }
details.log { margin-top: 8px; } details.log pre { white-space: pre-wrap; font-size: 12px; color: #b9c0cc; max-height: 260px; overflow: auto; background: #0c0e11; padding: 8px; border-radius: 8px; }

.editor { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.topbar { display: flex; gap: 10px; align-items: center; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.topbar input { flex: 1; min-width: 160px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; color: var(--text); font: inherit; }
.topbar .changed { color: var(--gold); font-size: 13.5px; white-space: nowrap; }
.filters { display: flex; gap: 6px; }
.filters button { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; font-size: 13px; }
.filters button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.cmpbar { padding: 6px 18px; font-size: 13px; color: var(--dim); background: #15181d; border-bottom: 1px solid var(--line); }
.split { flex: 1; display: flex; min-height: 0; }
nav { width: 260px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 10px 8px; }
nav button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--dim); font-size: 13.5px; }
nav button:hover { background: var(--panel); color: var(--text); }
nav button b { float: right; font-weight: 400; color: #6d7582; }
nav button b.sel { color: var(--gold); }
.list { flex: 1; overflow: auto; padding: 16px 22px 60px; }
.gtitle { font-size: 17px; font-weight: 700; color: var(--gold); margin: 22px 0 10px; }
.gtitle:first-child { margin-top: 0; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.item.sel { border-color: #2d5577; box-shadow: inset 3px 0 0 var(--blue); }
.item .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .name { font-weight: 700; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 20px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.st-same { background: #1c2a22; color: #8fd6a8; border-color: #2c5a3d; }
.st-new { background: #1d2f3f; color: #7fc4ff; border-color: #2d5577; }
.st-patch { background: #1d2f3f; color: #7fc4ff; border-color: #2d5577; }
.st-replace { background: #3a3120; color: var(--gold); border-color: #6b5a2c; }
.st-cant { background: #2c1a19; color: var(--red); border-color: #6b3430; }
.easy { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 8px 0 10px; font-size: 13.5px; }
.easy .k { color: var(--dim); white-space: nowrap; }
.easy .k.d { color: #7fc4ff; } .easy .k.w { color: var(--warn); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; }
.opts button small { font-size: 11px; color: var(--dim); }
.opts button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.opts button.on small { color: #dce9ff; }
.opts button.none.on { background: #4a4f58; border-color: #4a4f58; }
.detail { margin-top: 8px; font-size: 13px; background: #15181d; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.detail .w { color: var(--warn); } .detail .ok { color: #8fd6a8; } .detail .bad { color: var(--red); }
.params { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
.params label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.params label.num input[type=number] { width: 70px; }
.params label.num input[type=range] { width: 140px; padding: 0; }
.params select, .params input { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; color: var(--text); font: inherit; font-size: 13.5px; }
.prev { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
.prev img { width: 54px; height: 54px; object-fit: contain; background: #0c0e11; border-radius: 6px; border: 1px solid var(--line); }
.shots { margin: 2px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.srow { background: #15181d; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sfile { font-size: 11.5px; color: #6d7582; margin-bottom: 6px; word-break: break-all; }
.scells { display: flex; gap: 10px; flex-wrap: wrap; }
.scell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
.scell .lab { font-size: 12px; color: var(--dim); max-width: 150px; text-align: center; }
.scell img { height: 92px; max-width: 150px; object-fit: contain; border-radius: 6px; cursor: zoom-in; background: repeating-conic-gradient(#23272e 0% 25%, #1b1e24 0% 50%) 50% / 14px 14px; }
.scell .ph { height: 92px; width: 96px; display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--warn); border: 1px dashed #4a4f58; border-radius: 6px; padding: 4px; }
.scell .ph.same { color: var(--dim); }
.play { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 5px 14px; font-size: 13px; }
.play.on { background: var(--green2); border-color: var(--green2); color: #fff; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; cursor: zoom-out; }
.lightbox img { width: min(520px, 90vw); max-height: 80vh; object-fit: contain; background: repeating-conic-gradient(#23272e 0% 25%, #1b1e24 0% 50%) 50% / 20px 20px; }
.lightbox div { color: #ddd; margin-top: 10px; text-align: center; }
.ptable { border-collapse: collapse; margin: 6px 0 12px; font-size: 13px; background: #0c0e11; border-radius: 8px; overflow: hidden; }
.ptable th, .ptable td { padding: 4px 10px; border-bottom: 1px solid #1f232a; text-align: left; white-space: nowrap; }
.ptable th { color: var(--dim); font-weight: 400; background: #15181d; }
.ptable td.on, .ptable th.on { background: #18263a; }
.ptable img { height: 30px; vertical-align: middle; }
.fontrow { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
.fontbox { background: #0c0e11; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 260px; }
.fontbox .lab { font-size: 12px; color: var(--dim); } .fontbox .smp { font-size: 22px; line-height: 1.4; color: #e9dcb5; }
.empty { text-align: center; color: var(--dim); padding: 50px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b3038; border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 60; }
.profrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.profrow select { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; color: var(--text); font: inherit; font-size: 13.5px; min-width: 160px; }
#diffCard h3 { margin: 0 0 6px; font-size: 16px; } #diffCard table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
#diffCard td, #diffCard th { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: left; } #diffCard th { color: var(--dim); font-weight: 400; white-space: nowrap; }
.bis { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 55; }
.bis .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; width: min(640px, 92vw); max-height: 86vh; overflow: auto; }
.bis h2 { margin: 0 0 6px; font-size: 19px; } .bis .sub { margin-bottom: 12px; }
.bis ul { margin: 6px 0 14px; padding-left: 20px; font-size: 13.5px; color: var(--dim); max-height: 220px; overflow: auto; }
.bis .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.bis .good { background: var(--green2); border-color: var(--green2); color: #fff; } .bis .badb { background: #8a2c2c; border-color: #8a2c2c; color: #fff; }
@media (max-width: 760px) { nav { display: none; } .list { padding: 12px; } .chips { margin-left: 0; } }
</style>
</head>
<body>

<div class="home" id="home">
  <div class="brand"><h1>D2R 스킨 빌더</h1><span id="ver"></span></div>
  <p class="lead">내가 쓰는 스킨(mpq)을 그대로 두고, 원하는 기능만 골라 얹어서 새 스킨을 만들어요. 원래 스킨 파일은 바뀌지 않아요.</p>

  <div class="card">
    <div class="row">
      <div class="num">1</div>
      <div class="body"><div class="title">게임 폴더</div><div class="sub" id="gameSub">찾는 중...</div></div>
      <button class="btn" onclick="pickGame()">폴더 고르기</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="num">2</div>
      <div class="body"><div class="title">기준 스킨</div><div class="sub" id="baseSub"></div></div>
      <button class="btn" onclick="pickBase('')">mpq 파일 고르기</button>
    </div>
    <div class="chips" id="modChips"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="num">3</div>
      <div class="body"><div class="title">덧붙일 기능</div><div class="sub" id="featSub"></div></div>
      <button class="btn" onclick="openEditor()">기능 고르기</button>
    </div>
    <div class="chips" id="selChips"></div>
    <div class="profrow"><span class="sub">내 설정</span><select id="profSel"></select>
      <button class="btn small" onclick="profCmd('load')">불러오기</button>
      <button class="btn small" onclick="profSave()">지금 설정 저장</button>
      <button class="linkbtn" onclick="profCmd('delete')">지우기</button></div>
  </div>
  <div class="card hidden" id="diffCard"></div>

  <button class="big" id="buildBtn" onclick="startBuild()">스킨 만들어서 게임에 넣기</button>
  <div class="progress hidden" id="prog"><div class="bar"><i id="barFill"></i></div><div class="step" id="stepTxt"></div></div>
  <div class="result hidden" id="result"></div>

  <div class="foot">
    <button class="linkbtn" onclick="api('/api/open',{})">만든 스킨 파일이 있는 폴더 열기</button>
    <button class="linkbtn" id="uninstBtn" onclick="uninstall()">게임에서 만든 스킨 빼기</button>
    <button class="linkbtn" onclick="startBisect()">게임이 튕겨요 (원인 찾기)</button>
    <button class="linkbtn" onclick="applyPatch()">최신 mpq / 패치 파일 넣기 (업그레이드)</button>
  </div>
</div>

<div class="editor hidden" id="editor">
  <div class="topbar">
    <button class="btn" onclick="closeEditor()">← 다 골랐어요</button>
    <input id="q" placeholder="찾기 (예: 큐브, 로비, 화살표, 물약, 룬, 소리)">
    <div class="filters" id="filters"></div>
    <span class="changed" id="chgCount"></span>
    <button class="btn small" onclick="applyPreset()">추천대로 고르기</button>
    <button class="btn small" onclick="resetAll()">모두 빼기</button>
  </div>
  <div class="cmpbar" id="cmpbar"></div>
  <div class="split"><nav id="nav"></nav><div class="list" id="list"></div></div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="bis hidden" id="bis"><div class="box" id="bisBox"></div></div>
<div class="lightbox hidden" id="lb" onclick="this.classList.add('hidden')"><div><img id="lbImg"><div id="lbCap"></div></div></div>

<script>
let P = null, S = {choices: {}, params: {}}, STATE = null, STATUS = {}, saveTimer = null, FILTER = 'mine';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const byId = {};
async function api(url, body) {
  const r = await fetch(url, body === undefined ? {cache: 'no-store'} : {method: 'POST', body: JSON.stringify(body)});
  return r.json();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600); }
function mb(n) { return (n / 1048576).toFixed(0) + 'MB'; }

// ---------- 설정
function chosen(f) { return S.choices[f.id] || ''; }
function setChoice(f, key) {
  if (key) S.choices[f.id] = key; else delete S.choices[f.id];
  if (key) for (const r of (f.requires || [])) if (!S.choices[r]) { S.choices[r] = byId[r].options[0].key; toast(`"${byId[r].name}"도 같이 켰어요 (꼭 필요해요)`); }
  if (!key) for (const g of P.features) if ((g.requires || []).includes(f.id) && S.choices[g.id]) { delete S.choices[g.id]; toast(`"${g.name}"도 같이 뺐어요 (이 기능이 있어야 해요)`); }
  queueSave();
}
function param(id, dflt) { return id in S.params ? S.params[id] : dflt; }
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); updateCounts(); }
async function saveNow() { clearTimeout(saveTimer); saveTimer = null; await api('/api/settings', S); }
function selCount() { return Object.keys(S.choices).filter(k => byId[k]).length; }

// ---------- 첫 화면
function renderHome() {
  const st = STATE;
  $('ver').textContent = 'v' + st.version;
  const g = $('gameSub');
  if (st.gameFound) { g.textContent = '✓ ' + st.gameDir; g.className = 'sub ok'; }
  else { g.textContent = '게임 폴더를 못 찾았어요. [폴더 고르기]로 알려 주세요 (안 고르면 이 프로그램 폴더에 만들어져요)'; g.className = 'sub bad'; }
  const b = $('baseSub');
  if (st.base) { b.innerHTML = `✓ <b>${esc(st.base.mod)}</b> — ${esc(st.base.path)}<br>파일 ${st.base.files}개 · ${mb(st.base.size)} · ${esc(st.base.time)}`; b.className = 'sub ok'; }
  else if (st.baseErr) { b.textContent = st.baseErr; b.className = 'sub bad'; }
  else if (st.basePath) { b.textContent = '여는 중... ' + st.basePath; b.className = 'sub'; }
  else { b.textContent = '기능을 얹을 스킨 mpq를 골라 주세요 (예: 게임폴더\\mods\\yupgoolg\\yupgoolg.mpq)'; b.className = 'sub bad'; }
  $('modChips').innerHTML = (st.mods || []).length
    ? '<span class="sub" style="align-self:center">고를 수 있는 스킨:</span>' + st.mods.map(m => `<button class="chip ${st.base && st.base.path === m.path ? 'on' : ''}" onclick='pickBase(${JSON.stringify(m.path)})'>${esc(m.name)} <span class="sub">${esc(m.time)}</span></button>`).join('')
    : '';
  $('buildBtn').disabled = !st.base || st.job.running;
  $('uninstBtn').classList.toggle('hidden', !st.installed);
  updateCounts();
}
function updateCounts() {
  const n = selCount();
  $('featSub').textContent = n ? `${n}개 골랐어요` : '아직 고른 기능이 없어요 (안 골라도 기준 스킨 그대로 만들 수 있어요)';
  $('selChips').innerHTML = P.features.filter(f => S.choices[f.id]).map(f => {
    const o = f.options.find(o => o.key === S.choices[f.id]);
    return `<span class="chip">${esc(f.name)}${f.options.length > 1 && o ? ' · ' + esc(o.label) : ''}</span>`;
  }).join('');
  $('chgCount').textContent = n ? `고른 기능 ${n}개` : '';
}

async function refresh() { STATE = await api('/api/state'); renderHome(); return STATE; }
async function pickGame() {
  toast('폴더 고르는 창이 떴어요 (안 보이면 작업표시줄을 확인하세요)');
  const r = await api('/api/pickgame', {});
  if (!r.ok) { if (r.error) alert(r.error); return; }
  await refresh(); toast('게임 폴더를 바꿨어요');
}
async function pickBase(path) {
  if (!path) toast('파일 고르는 창이 떴어요 (안 보이면 작업표시줄을 확인하세요)');
  const r = await api('/api/pickbase', {Path: path});
  if (!r.ok) { if (r.error) alert(r.error); await refresh(); return; }
  STATUS = {};
  await refresh(); toast('기준 스킨을 열었어요. 기능마다 이 스킨과 비교하고 있어요');
  pollStatus();
}
async function pollStatus() {
  const r = await api('/api/status');
  STATUS = r.status || {};
  const c = r.cmp;
  $('cmpbar').innerHTML = !STATE.base ? '기준 스킨을 고르면 기능마다 “이미 있음 / 새로 더함 / 바꿈”을 알려 드려요'
    : c.running ? `기준 스킨(${esc(STATE.base.mod)})과 비교하는 중... ${c.total ? Math.round(c.done * 100 / c.total) : 0}%`
    : `기준 스킨 <b>${esc(STATE.base.mod)}</b>과 비교했어요 — <span class="badge st-same">✓ 이미 있음</span> <span class="badge st-new">새로 더함</span> <span class="badge st-patch">덧붙임</span> <span class="badge st-replace">⚠ 기준 스킨 파일을 바꿈</span> <span class="badge st-cant">넣을 수 없음</span>`;

    Object.entries(r.v).map(([l, v]) => `<div class="scell">${
      v === 'empty' ? '<div class="ph">비어 있음<br>(이 버전은<br>안 보이게 함)</div>'
      : v.startsWith('same:') ? `<div class="ph same">${esc(lab(v.slice(5)))}와<br>같은 그림</div>`
      : `<img src="${v}" loading="lazy" onclick="zoom('${v}','${esc(r.file)} · ${esc(lab(l))}')">`
    }<span class="lab">${esc(lab(l))}</span></div>`).join('')}</div></div>`).join('');
  const sounds = (f.sounds || []).map(r => `<div class="srow"><div class="sfile">🔊 ${esc(r.file)}</div><div class="scells">${
    Object.entries(r.v).map(([l, v]) => typeof v === 'number'
      ? `<button class="play" onclick="playSnd(this,${v})">▶ ${esc(lab(l))}</button>`
      : `<span class="sub" style="font-size:12.5px;padding:5px 4px">${esc(lab(l))}: ${v === 'empty' ? '소리 없음(꺼짐)' : esc(lab(v.slice(5))) + '와 같은 소리'}</span>`).join('')}</div></div>`).join('');
  const media = (shots || sounds) ? `<div class="shots">${shots}${sounds}</div>` + fontsHtml(f) : fontsHtml(f);
  const potion = f.kind === 'potion' ? potionTable(f, cur) : '';
  const req = (f.requires || []).length ? `<span class="badge">필요: ${f.requires.map(r => esc(byId[r].name)).join(', ')}</span>` : '';
  return `<div class="item ${cur ? 'sel' : ''}" id="it${idx}">
    <div class="head"><span class="name">${esc(f.name)}</span>${one ? stBadge(one) : ''}${req}</div>
    ${easy ? `<div class="easy">${easy}</div>` : (f.desc ? `<div class="sub">${esc(f.desc)}</div>` : '')}
    ${potion}${media || prev}
    <div class="opts">${opts}</div>${params}${detail}
  </div>`;
}
function pick(idx, oi) {
  const f = P.features[idx];
  setChoice(f, oi === '' ? '' : f.options[oi].key);
  renderList(true);
}
function setParam(id, v) { S.params[id] = v; queueSave(); }
function zoom(src, cap) { $('lbImg').src = src; $('lbCap').textContent = cap; $('lb').classList.remove('hidden'); }
const audio = new Audio(); let playingBtn = null;
function playSnd(btn, i) {
  if (playingBtn === btn && !audio.paused) { audio.pause(); btn.classList.remove('on'); playingBtn = null; return; }
  if (playingBtn) playingBtn.classList.remove('on');
  audio.src = '/api/sound?i=' + i; audio.play().catch(() => toast('이 소리는 재생할 수 없어요'));
  btn.classList.add('on'); playingBtn = btn;
}
audio.addEventListener('ended', () => { if (playingBtn) playingBtn.classList.remove('on'); playingBtn = null; });
const D2C = {'0': '#ffffff', '1': '#ff5050', '2': '#00e000', '3': '#7070ff', '4': '#c8b475', '5': '#8a8a8a', '6': '#444', '7': '#d4c27d', '8': '#ffa500', '9': '#ffff64', ':': '#00a000', ';': '#b44cff', '/': '#ffffff', '.': '#c8b475', '<': '#00e000'};
function d2text(sv) {
  let out = '', color = '#ffffff';
  for (const p of String(sv || '').split(/(ÿc.)/)) {
    if (/^ÿc.$/.test(p)) { color = D2C[p[2]] || '#ffffff'; continue; }
    if (p) out += `<span style="color:${color}">${esc(p)}</span>`;
  }
  return out || '<span class="sub">(없음)</span>';
}
function potionTable(f, cur) {
  const vers = Object.keys(f.potion_names);
  const lab = l => (f.options.find(o => o.key === l) || {label: l}).label;
  const head = `<tr><th>물약</th><th>그림</th>${vers.map(l => `<th class="${cur === l ? 'on' : ''}">${esc(lab(l))}</th>`).join('')}</tr>`;
  const rows = f.potions.map(p => `<tr><td>${esc(p.kr)}</td><td>${p.img ? `<img src="img/pot_${p.key}.webp" onerror="this.remove()">` : '-'}</td>${vers.map(l => `<td class="${cur === l ? 'on' : ''}">${d2text(f.potion_names[l][p.key])}</td>`).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto"><table class="ptable">${head}${rows}</table></div>`;
}
const loadedFonts = new Set();
function fontsHtml(f) {
  if (!f.fonts) return '';
  const lab = l => (f.labels && f.labels[l]) || l;
  return f.fonts.map(r => `<div class="sfile">🔤 ${esc(r.file)}</div><div class="fontrow">${Object.entries(r.v).map(([l, b]) => {
    if (!loadedFonts.has(b)) { loadedFonts.add(b); const ff = new FontFace('fb' + b, `url(/api/sound?i=${b})`); ff.load().then(x => document.fonts.add(x)).catch(() => {}); }
    return `<div class="fontbox"><div class="lab">${esc(lab(l))}</div><div class="smp" style="font-family:'fb${b}', sans-serif">디아블로 2 레저렉션<br>Diablo II · 조던의 반지 0123</div></div>`;
  }).join('')}</div>`).join('');
}

(async () => {
  P = await (await fetch('/api/pack')).json();
  P.features.forEach(f => byId[f.id] = f);
  const st = await refresh();
  S = {choices: st.settings.choices || {}, params: st.settings.params || {}};
  renderHome();
  bisPoll();
  profList();
  $('q').addEventListener('input', () => { clearTimeout(renderList.t); renderList.t = setTimeout(() => renderList(), 150); });
  if (st.basePath && !st.base) { const w = async () => { const s = await refresh(); if (!s.base && !s.baseErr) setTimeout(w, 500); else pollStatus(); }; w(); }
  else pollStatus();
  setInterval(() => fetch('/api/ping').catch(() => {}), 5000);
  fetch('/api/ping');
  addEventListener('pagehide', () => navigator.sendBeacon('/api/bye'));
})();
</script>
</body>
